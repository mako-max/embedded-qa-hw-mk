[pytest]
minversion = 8.0

testpaths = tests
pythonpath = .

python_files = test_*.py
python_functions = test_*

addopts =
    -v
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --capture=tee-sys

markers =
    functional: повна перевірка окремої функції пристрою
    smoke: коротка перевірка базової працездатності пристрою
    slow: тест виконується довше звичайного

xfail_strict = true
console_output_style = progress

junit_family = xunit2
junit_suite_name = embedded-qa-hardware

norecursedirs =
    .git
    .venv
    __pycache__
    reports
    build
    dist
